name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile --allow-build=prisma --allow-build=@prisma/engines
      - run: pnpm biome format --write .
      - run: pnpm check
      - run: pnpm build
      - name: Validate Render Blueprint YAML
        run: ruby -e "require 'yaml'; YAML.safe_load_file('render.yaml', aliases: true); puts 'Render Blueprint YAML syntax OK'"
      - name: Validate Docker Compose configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          OPENAI_API_KEY: ci-placeholder-openai-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: docker compose config --quiet
      - name: Build production container image
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            --tag raaha-ai-mock-interview:ci .
