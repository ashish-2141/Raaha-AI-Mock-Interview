name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile --allow-build=prisma --allow-build=@prisma/engines
      - run: pnpm biome format --write .
      - run: pnpm check
      - run: pnpm build
      - name: Validate Render Blueprint YAML
        run: |
          ruby -e 'require "yaml"; YAML.safe_load_file("render.yaml", aliases: true); puts "Render Blueprint YAML syntax OK"'
      - name: Validate Docker Compose configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          OPENAI_API_KEY: ci-placeholder-openai-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: docker compose config --quiet
      - name: Build production container image
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          # Docker Hub occasionally rate-limits anonymous base-image HEAD requests.
          # Retry only that transient case; surface any other build error immediately.
          for attempt in 1 2 3; do
            set +e
            set -o pipefail
            docker build \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
              --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
              --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
              --tag raaha-ai-mock-interview:ci . 2>&1 | tee /tmp/raaha-docker-build.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -q "429 Too Many Requests" /tmp/raaha-docker-build.log; then
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Docker Hub returned HTTP 429; retrying in ${delay}s (attempt $((attempt + 1))/3)."
              sleep "$delay"
            fi
          done
          echo "Docker Hub rate limit persisted after 3 attempts."
          exit 1
