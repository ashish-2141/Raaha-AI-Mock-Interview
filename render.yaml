services:
  - type: keyvalue
    name: raaha-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  - type: web
    name: raaha-ai-mock-interview
    runtime: docker
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_RESUME_MODEL
        value: gpt-5.5
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: raaha-redis
          property: connectionString
