name: Free staging smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://raaha-ai-mock-interview-free.onrender.com
    steps:
      - name: Wait for the free Render deploy and verify Redis-backed health
        run: |
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error --max-time 12 --write-out $'\n%{http_code}' "$BASE_URL/api/health" 2>&1 || true)"
            status="$(printf '%s\n' "$response" | tail -n 1)"
            body="$(printf '%s\n' "$response" | sed '$d')"

            if [ "$status" = "200" ] &&
              printf '%s' "$body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' &&
              printf '%s' "$body" | grep -Eq '"redis"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Staging health passed: HTTP 200; Redis dependency is healthy."
              printf '%s\n' "$body"
              exit 0
            fi

            echo "Staging not healthy yet (attempt $attempt/30; HTTP $status). Retrying in 10 seconds."
            sleep 10
          done

          echo "Staging health did not pass after 30 attempts. Check the Render deploy and logs."
          exit 1

      - name: Smoke-test student and TPO page routes
        run: |
          set -eu
          for route in / /login /resumes /voice-interview /live-coding /college-dashboard; do
            status="$(curl --silent --show-error --output /tmp/raaha-page.html --write-out '%{http_code}' --max-time 25 "$BASE_URL$route")"
            if [ "$status" != "200" ]; then
              echo "Route $route returned HTTP $status, expected 200."
              head -c 500 /tmp/raaha-page.html || true
              exit 1
            fi
            echo "PASS $route HTTP $status"
          done

      - name: Verify public coding challenge omits hidden tests
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 25 "$BASE_URL/api/coding/challenge?id=two-sum" -o /tmp/raaha-challenge.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          challenge = json.loads(Path("/tmp/raaha-challenge.json").read_text())
          assert challenge.get("id") == "two-sum", "unexpected challenge id"
          assert challenge.get("title") == "Two Sum", "public challenge title missing"
          assert "starterCode" in challenge, "starter code missing"
          assert "hiddenCases" not in challenge, "hidden test cases must not be public"
          assert "expected" not in challenge, "hidden expected answers must not be public"
          print("PASS public challenge metadata; hidden cases and answers are absent")
          PY
